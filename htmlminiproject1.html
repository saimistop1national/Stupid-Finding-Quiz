<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stupid Finding Quiz</title>
    <style>
        /* styling rahhhhhhhh*/
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            margin: 0;
            padding: 50px 20px;
            /*nebula background*/
            background-image: url('https://images.unsplash.com/photo-1543722530-d2c3201371e7?q=80&w=2674&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .quiz-box { 
            max-width: 700px; 
            width: 100%;
            margin: auto; 
            /*GLASSY BACKGROUND(I FOUND THE BLUR THING LIKE 5 MINUTES AGO ON GOOGLE)*/
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            padding: 40px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            text-align: left;
            box-sizing: border-box;
        }
        #progress {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #d1d5db; /*text for progress */
            margin-bottom: 8px;
            display: inline-block;
            border-bottom: 2px solid #8b5cf6; /*underline thinger*/
            padding-bottom: 4px;
        }
        #question {
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
            margin-top: 15px;
            margin-bottom: 30px;
            line-height: 1.5;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        button { 
            display: block; 
            width: 100%; 
            margin: 12px 0; 
            padding: 16px 20px; 
            font-size: 17px; 
            cursor: pointer; 
            /*grey button that glows on hover */
            background: rgba(255, 255, 255, 0.03);
            color: #e5e7eb;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            text-align: left;
            transition: all 0.2s ease-in-out;
            font-family: inherit;
            line-height: 1.4;
        }
        button:hover:not(:disabled) {
            background: rgba(139, 92, 246, 0.15); /* Subtle violet tint */
            border-color: rgba(139, 92, 246, 0.5);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
            transform: translateY(-1px);
        }
        button:active:not(:disabled) {
            transform: translateY(0);
        }
        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
        #result { 
            font-weight: bold; 
            font-size: 19px; 
            margin: 25px 0 15px 0; 
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .next-btn { 
            /*gradient yahhhh*/
            background: linear-gradient(135deg, #7e22ce 0%, #2563eb 100%); 
            color: white; 
            border: none; 
            font-weight: bold; 
            text-align: center;
            box-shadow: 0 4px 14px rgba(126, 34, 206, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 20px !important;
        }
        .next-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #9333ea 0%, #3b82f6 100%);
            box-shadow: 0 6px 20px rgba(126, 34, 206, 0.7);
        }
    </style>
</head>
<body>
<div class="quiz-box">
    <p id="progress">Question 1 of 25</p>
    <h2 id="question">Loading...</h2>
    <div id="options"></div>
    <p id="result"></p>
    <button id="next" class="next-btn" style="display:none;" onclick="nextQuestion()">Next Question</button>
</div>
<script>
    //The questions, wrong answers, and right ones. They have the label things which decide what they are, a key.
    const quizData = [
        { q: "1. What is 1 + 1?", choices: ["4", "1", "3", "2"], correct: "2" },
        { q: "2. Which planet is closest to the Sun?", choices: ["Mercury", "Venus", "Mars", "Earth"], correct: "Mercury" },
        { q: "3. What is the largest ocean on Earth?", choices: ["Atlantic", "Pacific", "Indian", "Arctic"], correct: "Pacific" },
        { q: "4. What gas do plants absorb during photosynthesis?", choices: ["Oxygen", "Nitrogen", "Carbon Dioxide", "Hydrogen"], correct: "Carbon Dioxide" },
        { q: "5. What is the chemical symbol for water?", choices: ["CO2", "NaCl", "O2", "H2O"], correct: "H2O" },
        { q: "6. Who painted the Mona Lisa?", choices: ["Van Gogh", "Da Vinci", "Picasso", "Monet"], correct: "Da Vinci" },
        { q: "7. Light travels fastest through which medium?", choices: ["Water", "Glass", "A Vacuum", "Air"], correct: "A Vacuum" },
        { q: "8. What is the name of our home galaxy?", choices: ["Andromeda", "Triangulum", "Sombrero", "Milky Way"], correct: "Milky Way" },
        { q: "9. What is the square root of 144?", choices: ["12", "10", "11", "14"], correct: "12" },
        { q: "10. What is the most abundant gas in Earth's atmosphere?", choices: ["Oxygen", "Argon", "Carbon Dioxide", "Nitrogen"], correct: "Nitrogen" },
        { q: "11. Which subatomic particle carries a negative charge?", choices: ["Electron", "Proton", "Neutron", "Quark"], correct: "Electron" },
        { q: "12. What boundary around a black hole marks the point of no return?", choices: ["Ergosphere", "Event Horizon", "Singularity", "Accretion Disk"], correct: "Event Horizon" },
        { q: "13. Einstein's General Relativity describes gravity as the warping of what?", choices: ["Light waves", "Magnetic fields", "Centrifugal force", "Spacetime"], correct: "Spacetime" },
        { q: "14. What is the theoretical infinitely dense center of a black hole called?", choices: ["Photon Sphere", "Wormhole", "Singularity", "Dark Core"], correct: "Singularity" },
        { q: "15. HALFWAY SKILL CHECK: What is the theorized output of a binary black hole merger?", choices: ["They collide silently, creating a negative mass exactly opposite to the two black holes' combined mass, cancelling eachother out and creating a nonexistent, even 'imaginary', mass.", "They radiate massive gravitational waves, similar to a scale 2 trillion earthquake(beeg number) and fuse into one larger black hole with a strong  implosion causing all mass within a large area to merge into the black holes too.", "They stray away from eachother due to extreme mass of the singularaties causing an intense repulsion, because the two infinities cannot coexist within eachother, and thus propel to prevent collision. ", "They instantly tear open a permanent, traversable wormhole to another universe due to the two black holes' singularaties, two infinities which already warp reality, combining.", "They, due to being two infinities that break reality, combine into a larger black hole, due to this, they break gravity and experience extreme negative gravity, and since a negative times a positive is a negative, they become a matter-reppeling 'White hole', so to say.", "They halt time permanently for the entire host galaxy due to the extreme collision brekaing everything and shaking the space time continuum so majorly that it speeds up to near instant, but in some areas, the time passsing reaches negative,(LOOK AT SOUND WAVES, THIS IS HOW THE TIME RIPPLES LOOK LIKE), causing immense time dilation, and once that happens, time rewinds to before the blackhole merger event occured, thus creating a theoretical Samsara loop, where the black holes have not collided, and the time dilation is non-present, until the merger event is never seen to occur."], correct: "They radiate massive gravitational waves, similar to a scale 2 trillion earthquake(beeg number) and fuse into one larger black hole with a strong  implosion causing all mass within a large area to merge into the black holes too."},
        { q: "16. What is the Hawking Radiation mechanism that causes a black hole to lose mass?", choices: ["The singularity sheds dark energy layers directly into the accretion disk.", "Gravitons escape through tiny microscopic wormholes via quantum tunneling.", "Virtual particle-antiparticle pairs separate near the event horizon; one falls in while the other escapes as radiation.", "The cosmic microwave background collides with the photon sphere, reflecting mass outward."], correct: "Virtual particle-antiparticle pairs separate near the event horizon; one falls in while the other escapes as radiation." },
        { q: "17. According to the Cosmic Censorship Hypothesis, what cannot exist in our universe?", choices: ["A universe with zero dark matter", "A particle moving exactly at 100.01% the speed of light", "A black hole with positive charge and negative spin", "A naked singularity unshielded by an event horizon"], correct: "A naked singularity unshielded by an event horizon" },
        { q: "18. What region of a rotating (Kerr) black hole allows energy to be extracted via the Penrose Process?", choices: ["The Inner Horizon", "The Ergosphere", "The Photon Sphere", "The Schwarzchild Radius"], correct: "The Ergosphere" },
        { q: "19. The 'Black Hole Information Paradox' highlights a direct contradiction between General Relativity and which principle of Quantum Mechanics?", choices: ["The Heisenberg Uncertainty Principle", "Quantum Superposition", "Unitarity (the principle that the total probability of all possible outcomes must always equal 1)", "The Pauli Exclusion Principle"], correct: "Unitarity (the principle that the total probability of all possible outcomes must always equal 1)" },
        { q: "20. What is the theoretical final state of our universe if cosmic expansion continues to accelerate indefinitely, ripping apart galaxies, atoms, and spacetime itself?", choices: ["The Big Crunch", "The Big Freeze", "The Cosmic Bounce", "The Big Rip"], correct: "The Big Rip" },
        { q: "21. In String Theory, how many total dimensions (space + time) are mathematically required for the equations of Superstring Theory to be consistent?", choices: ["4 dimensions", "11 dimensions", "10 dimensions", "26 dimensions"], correct: "10 dimensions" },
        { q: "22. What bizarre thermodynamic phenomenon states that a black hole's entropy is proportional to its surface area rather than its volume?", choices: ["The Second Law of Quantum Thermodynamics", "The Holographic Principle", "The Unruh Effect", "The No-Hair Theorem"], correct: "The Holographic Principle" },
        { q: "23. If you were to observe an object falling into a black hole from a safe distance, what would you actually see?", choices: ["The object would instantly blink out of existence the exact millisecond it touched the outer accretion disk.", "The object would bounce off the event horizon due to intense centrifugal radiation pressure.", "The object would appear to freeze at the event horizon and infinitely fade away due to gravitational redshift.", "The object would visibly split into two identical copies due to quantum entanglement scaling."], correct: "The object would appear to freeze at the event horizon and infinitely fade away due to gravitational redshift." },
        { q: "24. What is the name of the theoretical class of black holes formed a fraction of a second after the Big Bang, which did not result from stellar collapse?", choices: ["Intermediate-Mass Black Holes", "Primordial Black Holes", "Supermassive Black Holes", "Micro-Quantum Singularities"], correct: "Primordial Black Holes" },
        { q: "25. IF YOU DONT GET THIS RIGHT, YE DUM: According to Loop Quantum Gravity, what replaces the infinitely dense 'Singularity' at the core of a black hole?", choices: ["An empty, hollow vacuum chamber that leads directly into a mirrored mirror-verse.", "A ball of pure, fundamental quarks tightly bound by gluon forces that ignore the laws of standard mass.", "A state of pure dark matter fluid that spins faster than the speed of light, keeping gravity balanced.", "A 'Planck Star' where space is compressed to the absolute minimum scale, creating a quantum bounce that prevents infinite density."], correct: "A 'Planck Star' where space is compressed to the absolute minimum scale, creating a quantum bounce that prevents infinite density." }
    ]
    //starts you at the BEGINNING
    let index = 0;
    let score = 0;
    function showQuestion() {
        //Clears old feedback and displays new ones
        document.getElementById("result").innerText = "";
        document.getElementById("next").style.display = "none";
        document.getElementById("options").innerHTML = "";
        //checks if you're done
        if (index >= quizData.length) {
            document.getElementById("progress").innerText = "Quiz Finished!";
            document.getElementById("question").innerText = `Final Score: ${score} / ${quizData.length}`;
            return;
        }
        //fairly obvious.
        let current = quizData[index];
        document.getElementById("progress").innerText = `Question ${index + 1} of ${quizData.length}`;
        document.getElementById("question").innerText = current.q;

        //Builds the buttons automatically. REALLY proud of this, took me so long to figure out how to work it!
        current.choices.forEach(choice => {
            let btn = document.createElement("button");
            btn.innerText = choice;
            //current is the current question, correct is a variable that has the correct answer from the key
            btn.onclick = () => selectAnswer(choice, current.correct);
            document.getElementById("options").appendChild(btn);
        });
    }
    function selectAnswer(chosen, correct) {
        let res = document.getElementById("result");
        //the if loop that calls you stupid(best part)
        if (chosen === correct) {
            res.innerText = "Correct! Unexpected, really!";
            /* Neon green for correct feedback on dark background */
            res.style.color = "#4ade80"; 
            score++;
        } else {
            res.innerText = "Wrong! YOU'RE STUPID! WORTHLESS! DUMB! IDIOTIC! MORONIC! PHAT WITH A PH!";
            /* Bright scarlet red for wrong feedback on dark background */
            res.style.color = "#fb7185";
        }
        //Stops you from clicking buttons(I USED ARROW FUNCTION!!!!)
        let buttons = document.querySelectorAll("#options button");
        buttons.forEach(b => b.disabled = true);
        //Navigation thinger
        document.getElementById("next").style.display = "block";
    }
    //Index++ adds one to index, moving to next question
    function nextQuestion() {
        index++;
        showQuestion();
    }
    //Start loading when the page loads
    showQuestion();
</script>
</body>
</html>
